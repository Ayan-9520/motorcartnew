<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GaadiBazaar — Home (Mock Fixture)</title>
  </head>
  <body>
    <section data-gb="home-hero-banner">Find your next vehicle across India</section>
    <form data-gb="home-search-form">
      <input data-gb="home-search-input" type="search" placeholder="Search brand or model" value="" />
      <select data-gb="home-city-select">
        <option value="">Select city</option>
        <option data-gb-city="delhi" value="delhi">Delhi</option>
        <option data-gb-city="mumbai" value="mumbai">Mumbai</option>
      </select>
      <button data-gb="home-search-button" type="submit">Search</button>
    </form>
  </body>
</html>
