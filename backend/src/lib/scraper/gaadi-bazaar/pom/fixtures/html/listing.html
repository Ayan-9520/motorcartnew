<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GaadiBazaar — Listing (Mock Fixture)</title>
  </head>
  <body>
    <nav data-gb="listing-pagination">
      <span data-gb="listing-pagination-current">1</span>
      <button data-gb="listing-next-page" type="button">Next</button>
    </nav>
    <section data-gb="listing-results">
      <article
        data-gb="listing-vehicle-card"
        data-title="2025 Hyundai Creta SX(O) Diesel AT"
        data-href="mock://gaadi-bazaar/vehicle/gb-creta-12345"
        data-price="₹14,90,000"
        data-location="Delhi"
        data-image="https://cdn.example.com/gaadi/creta-front.jpg"
      >
        <a data-gb="listing-vehicle-link" href="mock://gaadi-bazaar/vehicle/gb-creta-12345">View</a>
        <h2 data-gb="listing-vehicle-title">2025 Hyundai Creta SX(O) Diesel AT</h2>
        <p data-gb="listing-vehicle-price">₹14,90,000</p>
        <p data-gb="listing-vehicle-location">Delhi</p>
        <img data-gb="listing-vehicle-image" src="https://cdn.example.com/gaadi/creta-front.jpg" alt="Creta" />
      </article>
      <article
        data-gb="listing-vehicle-card"
        data-title="2025 Maruti Suzuki Swift VXI"
        data-href="mock://gaadi-bazaar/vehicle/gb-swift-67890"
        data-price="₹6,50,000"
        data-location="Mumbai"
        data-image="https://cdn.example.com/gaadi/swift.jpg"
      >
        <a data-gb="listing-vehicle-link" href="mock://gaadi-bazaar/vehicle/gb-swift-67890">View</a>
        <h2 data-gb="listing-vehicle-title">2025 Maruti Suzuki Swift VXI</h2>
        <p data-gb="listing-vehicle-price">₹6,50,000</p>
        <p data-gb="listing-vehicle-location">Mumbai</p>
        <img data-gb="listing-vehicle-image" src="https://cdn.example.com/gaadi/swift.jpg" alt="Swift" />
      </article>
    </section>
  </body>
</html>
