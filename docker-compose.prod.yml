# Production overrides — use with:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Postgres/Redis are NOT exposed publicly. Only nginx (80/443) and optional mobile web (8090).

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    # Production must load .env.production into the container (not only for ${} substitution).
    # Do NOT set SMTP_*=${SMTP_*:} here — empty defaults override env_file and wipe mail config.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      STRICT_DB_QUERY: ${STRICT_DB_QUERY:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      FRONTEND_URL: ${FRONTEND_URL:-https://motorcart.in}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://motorcart.in,https://www.motorcart.in}

  frontend:
    build:
      args:
        VITE_FULL_ECOSYSTEM: ${VITE_FULL_ECOSYSTEM:-true}
        VITE_FEATURE_WISHLIST_DB: ${VITE_FEATURE_WISHLIST_DB:-true}
        VITE_FEATURE_UNIFIED_VEHICLE_API: ${VITE_FEATURE_UNIFIED_VEHICLE_API:-true}
        VITE_FEATURE_M4_NOTIFICATIONS: ${VITE_FEATURE_M4_NOTIFICATIONS:-true}
        VITE_REAL_DATA_ONLY: ${VITE_REAL_DATA_ONLY:-true}
        VITE_ADMIN_DEMO_FALLBACK: ${VITE_ADMIN_DEMO_FALLBACK:-false}

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment after certbot:
      # - /etc/letsencrypt:/etc/letsencrypt:ro

  mobile-app:
    profiles: ["mobile"]
    build:
      context: ./apps/mobile-customer
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${MOBILE_EXPO_PUBLIC_API_URL:-}
        EXPO_PUBLIC_WEB_URL: ${MOBILE_EXPO_PUBLIC_WEB_URL:-${VITE_SITE_URL:-https://motorcart.in}}
        EXPO_PUBLIC_SHOW_DEMO: ${MOBILE_SHOW_DEMO:-0}
        MOBILE_API_UPSTREAM: ${MOBILE_API_UPSTREAM:-http://backend:3001}
        MOBILE_API_HOST: ${MOBILE_API_HOST:-backend}
    image: motorcart-mobile-app:local
    restart: unless-stopped
    ports:
      - "${MOBILE_APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
