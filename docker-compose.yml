name: motorcart

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorcart}
      POSTGRES_USER: ${POSTGRES_USER:-motorcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motorcart} -d ${POSTGRES_DB:-motorcart}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LOCAL-ONLY fixture JSON API for catalog master dry-run (not a real vehicle provider)
  catalog-master-mock:
    build:
      context: ./tools/catalog-master-mock-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3099
      CATALOG_MASTER_API_KEY: ${CATALOG_MASTER_API_KEY:-local-dev-mock-key}
    ports:
      - "${CATALOG_MASTER_MOCK_PORT:-3099}:3099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3099/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-motorcart}:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-motorcart}?schema=public
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-motorcart}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FEATURE_FULL_ECOSYSTEM: ${FEATURE_FULL_ECOSYSTEM:-true}
      CATALOG_MASTER_SOURCE: ${CATALOG_MASTER_SOURCE:-json_api}
      CATALOG_MASTER_SOURCE_URL: ${CATALOG_MASTER_SOURCE_URL:-http://catalog-master-mock:3099/v1/vehicles}
      CATALOG_MASTER_API_KEY: ${CATALOG_MASTER_API_KEY:-local-dev-mock-key}
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-master-mock:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost}
        VITE_FULL_ECOSYSTEM: ${VITE_FULL_ECOSYSTEM:-true}
        VITE_FEATURE_WISHLIST_DB: ${VITE_FEATURE_WISHLIST_DB:-true}
        VITE_FEATURE_UNIFIED_VEHICLE_API: ${VITE_FEATURE_UNIFIED_VEHICLE_API:-true}
        VITE_FEATURE_M4_NOTIFICATIONS: ${VITE_FEATURE_M4_NOTIFICATIONS:-true}
        VITE_REAL_DATA_ONLY: ${VITE_REAL_DATA_ONLY:-true}
        VITE_ADMIN_DEMO_FALLBACK: ${VITE_ADMIN_DEMO_FALLBACK:-false}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mobile-app:
    build:
      context: ./apps/mobile-customer
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${MOBILE_EXPO_PUBLIC_API_URL:-}
        EXPO_PUBLIC_WEB_URL: ${VITE_SITE_URL:-http://localhost:3000}
        EXPO_PUBLIC_SHOW_DEMO: ${MOBILE_SHOW_DEMO:-1}
    image: motorcart-mobile-app:local
    restart: unless-stopped
    ports:
      - "${MOBILE_APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
