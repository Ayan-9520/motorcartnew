name: motorcart

# Core local stack (fast):
#   docker compose --env-file .env.docker up -d --build
# Optional tools mock:  --profile tools
# Optional mobile app:  --profile mobile
#
# Isolated from other Compose projects (e.g. kuberone): own network + localhost-bound ports.
# Host ports: MotorCart 3000 / 5432 / 6379 · keep other apps on different ports (kuberone uses 6380 / 3306).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [motorcart_net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorcart}
      POSTGRES_USER: ${POSTGRES_USER:-motorcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motorcart} -d ${POSTGRES_DB:-motorcart}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [motorcart_net]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local fixture API for catalog-master dry-runs (not needed for dealer inventory)
  catalog-master-mock:
    profiles: ["tools"]
    build:
      context: ./tools/catalog-master-mock-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [motorcart_net]
    environment:
      PORT: 3099
      CATALOG_MASTER_API_KEY: ${CATALOG_MASTER_API_KEY:-local-dev-mock-key}
    ports:
      - "127.0.0.1:${CATALOG_MASTER_MOCK_PORT:-3099}:3099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3099/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [motorcart_net]
    env_file:
      - .env.docker
    environment:
      PORT: 3001
      # Force production in Docker so Next.js does not JIT-compile (fixes timeouts when other stacks run)
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-motorcart}:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-motorcart}?schema=public
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-motorcart}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FEATURE_FULL_ECOSYSTEM: ${FEATURE_FULL_ECOSYSTEM:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      CATALOG_MASTER_SOURCE: ${CATALOG_MASTER_SOURCE:-json_api}
      CATALOG_MASTER_SOURCE_URL: ${CATALOG_MASTER_SOURCE_URL:-}
      CATALOG_MASTER_API_KEY: ${CATALOG_MASTER_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    # Soft cap so MotorCart cannot starve other local stacks (kuberone, etc.)
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
        VITE_FULL_ECOSYSTEM: ${VITE_FULL_ECOSYSTEM:-true}
        VITE_FEATURE_WISHLIST_DB: ${VITE_FEATURE_WISHLIST_DB:-true}
        VITE_FEATURE_UNIFIED_VEHICLE_API: ${VITE_FEATURE_UNIFIED_VEHICLE_API:-true}
        VITE_FEATURE_M4_NOTIFICATIONS: ${VITE_FEATURE_M4_NOTIFICATIONS:-true}
        VITE_REAL_DATA_ONLY: ${VITE_REAL_DATA_ONLY:-true}
        VITE_ADMIN_DEMO_FALLBACK: ${VITE_ADMIN_DEMO_FALLBACK:-false}
    restart: unless-stopped
    networks: [motorcart_net]
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  mobile-app:
    profiles: ["mobile"]
    build:
      context: ./apps/mobile-customer
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${MOBILE_EXPO_PUBLIC_API_URL:-}
        EXPO_PUBLIC_WEB_URL: ${VITE_SITE_URL:-http://localhost:3000}
        EXPO_PUBLIC_SHOW_DEMO: ${MOBILE_SHOW_DEMO:-1}
    image: motorcart-mobile-app:local
    restart: unless-stopped
    networks: [motorcart_net]
    ports:
      - "127.0.0.1:${MOBILE_APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [motorcart_net]
    ports:
      # Bind all interfaces so http://localhost:3000 works on Windows (IPv4 + IPv6)
      - "${NGINX_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

networks:
  motorcart_net:
    name: motorcart_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
