<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#d5dee8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F4F0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F4F4F0"/>
      <stop offset="100%" stop-color="#B0B0AD"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="760" rx="420" ry="28" fill="#0f172a" opacity="0.12"/>
  <g filter="url(#soft)" transform="translate(180,210) scale(1.55)">
    <!-- SUV body -->
    <path d="M80 220 C110 160 180 120 280 110 L520 100 C620 98 700 130 760 170 L820 220 L840 250 L840 300 L70 300 Z" fill="url(#body)"/>
    <path d="M250 118 L310 118 L400 170 L280 175 Z" fill="url(#glass)"/>
    <path d="M420 115 L620 108 L700 160 L520 172 Z" fill="url(#glass)"/>
    <path d="M80 220 L840 220" stroke="#0f172a" stroke-opacity="0.12" stroke-width="3"/>
    <rect x="70" y="248" width="780" height="18" rx="4" fill="#0f172a" opacity="0.18"/>
    <!-- wheels -->
    <circle cx="220" cy="300" r="58" fill="#111827"/>
    <circle cx="220" cy="300" r="28" fill="#9ca3af"/>
    <circle cx="700" cy="300" r="58" fill="#111827"/>
    <circle cx="700" cy="300" r="28" fill="#9ca3af"/>
    <!-- lights -->
    <ellipse cx="820" cy="240" rx="22" ry="14" fill="#fef3c7"/>
    <ellipse cx="95" cy="245" rx="14" ry="10" fill="#fecaca"/>
  </g>
  <text x="80" y="860" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Motorcart demo · Pristine White · 1600×900</text>
</svg>
